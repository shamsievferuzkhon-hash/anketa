@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg2);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:12px 4px 8px}
h1{font-size:18px;margin:0 0 6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.pct{font-size:13px;color:var(--hint);margin-top:4px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bolim{font-weight:700;font-size:15px;margin:22px 4px 4px}
.f{padding:10px 0;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.f.hid{display:none}
label.q{display:block;font-weight:600;margin-bottom:4px}
.q .req{color:var(--err)}
.h{font-size:13px;color:var(--hint);margin:-2px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:18px;padding:8px 13px;font:inherit;font-size:15px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.bq{margin-top:8px}
.e{color:var(--err);font-size:13px;margin-top:4px;display:none}
.f.bad .e{display:block}
.f.bad input,.f.bad textarea{border-color:var(--err)}
.rasm{margin-top:8px}
.rasm summary{color:var(--acc);cursor:pointer;font-size:14px}
.rasm img{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.ish{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg2)}
.ish .t{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.ish .row{margin:6px 0}
.ish .row label{font-size:14px;color:var(--hint)}
.del{background:none;border:0;color:var(--err);font:inherit;font-size:14px;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--acc);color:var(--acc-tx);cursor:pointer}
.btn.sec{background:var(--bg2);color:var(--acc);border:1px solid var(--line);font-weight:600;margin-top:8px}
.two{display:flex;gap:8px;align-items:center}
.two>*{flex:1}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:22px;height:22px;flex:0 0 22px;margin-top:1px}
.note{font-size:14px;color:var(--hint)}
.size{font-size:12px;color:var(--hint);text-align:right;margin-top:6px}
#xabar{display:none;position:fixed;left:12px;right:12px;bottom:16px;z-index:9;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px}
#yubor{margin-top:16px}
</style>

// ---------- текширувлар (ботдаги nomzod_anketa.tekshir() билан бир хил) ----------
const LAT = {'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X'};
function sanaOk(x){
  const m = /^\s*(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})\s*$/.exec(x || ''); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3]; const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  if (y < 1940 || y > 2100) return null;
  return String(d).padStart(2,'0') + '.' + String(mo).padStart(2,'0') + '.' + y;
}
function telOk(x){ let d = (x || '').replace(/\D/g, ''); if (d.length === 9) d = '998' + d; return (d.length === 12 && d.startsWith('998')) ? '+' + d : null; }
function tekshir(t, x, f){
  x = (x || '').trim(); if (!x) return 'Жавоб бўш.';
  if (t === 'matn'){
    if (x.length > 1000) return 'Жуда узун.';
    if (f && f.min && x.split(/\s+/).length < f.min && !(f.v || []).includes(x)) return 'Тўлиқроқ ёзинг (камида ' + f.min + ' сўз).';
    return null;
  }
  if (t === 'sana'){
    const v = sanaOk(x); if (!v) return 'Сана нотўғри. Шу шаклда ёзинг: КК.ОО.ЙЙЙЙ (масалан 15.03.2001).';
    if (f && f.k === 'tugilgan'){ const y = +v.slice(-4); if (y < 1950 || y > YIL - 15) return 'Туғилган йил нотўғри кўринади.'; }
    return null;
  }
  if (t === 'pinfl'){ const d = x.replace(/[\s\-_.,]/g, ''); return /^\d{14}$/.test(d) ? null : 'ЖШШИР 14 та рақамдан иборат бўлиши керак (ҳозир ' + x.replace(/\D/g,'').length + ' та рақам).'; }
  if (t === 'pasport'){
    let d = x.replace(/[\s\-№]/g, '').toUpperCase().replace(/[АВЕКМНОРСТХ]/g, c => LAT[c]);
    return /^[A-Z]{2}\d{7}$/.test(d) ? null : '2 та лотин ҳарфи + 7 та рақам бўлиши керак (масалан AD1234567).';
  }
  if (t === 'tel') return telOk(x) ? null : 'Телефон рақам нотўғри. Масалан: +998 90 123 45 67';
  if (t === 'yil'){
    if (f && (f.v || []).includes(x)) return null;
    return (/^(19[5-9]\d|20\d\d)$/.test(x) && +x <= YIL + 6) ? null : 'Йилни 4 та рақам билан ёзинг (масалан 2018).';
  }
  if (t === 'summa'){ const d = x.replace(/\D/g, ''); return (d && +d >= 100000 && +d <= 1000000000) ? null : 'Суммани сўмда рақам билан ёзинг (масалан 4 500 000).'; }
  if (t === 'manzil') return x.split(/\s+/).length >= 3 ? null : 'Тўлиқроқ ёзинг (туман, маҳалла, кўча, уй).';
  if (t === 'soat'){
    const m = /^(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})$/.exec(x);
    return (m && +m[1] <= 23 && +m[3] <= 23 && +m[2] <= 59 && +m[4] <= 59) ? null : 'Шу шаклда ёзинг: ЧЧ:ММ–ЧЧ:ММ (масалан 09:00–18:00).';
  }
  if (t === 'davr'){
    const m = /^(\d{1,2})[./](\d{4})\s*[-–—]\s*(?:(\d{1,2})[./](\d{4})|(ҳозиргача))$/i.exec(x);
    if (!m || +m[1] < 1 || +m[1] > 12 || (m[3] && (+m[3] < 1 || +m[3] > 12))) return 'Шу шаклда ёзинг: 03.2022 ва 08.2024 (ёки «ҳозиргача»).';
    if (m[3] && (+m[4] * 12 + +m[3]) < (+m[2] * 12 + +m[1])) return 'Тугаш санаси бошланишидан олдин бўлиши мумкин эмас.';
    return null;
  }
  return null;
}

function qiymatMatn(k){
  const f = F.find(z => z.k === k), v = val[k]; if (!f || !v) return '';
  if (v.i !== undefined) return (f.v || [])[v.i] || '';
  return v.s || '';
}
function aktiv(f){
  if (!f.shart) return true;
  const v = qiymatMatn(f.shart[0]); if (!v) return false;
  return f.shart[1].startsWith('!') ? v !== f.shart[1].slice(1) : v === f.shart[1];
}

function chips(opts, multi, onchange){

    if ((f.t === 'matn' || f.t === 'yil') && f.v){
      const c = chips(f.v, false, on => { if (on.some(Boolean)) { inp.value = f.v[on.indexOf(true)]; } inp.dispatchEvent(new Event('input')); });
      c.box.style.marginTop = '8px'; d.appendChild(c.box);
      inp.addEventListener('input', () => c.btns.forEach((b, i) => b.classList.toggle('on', inp.value.trim() === f.v[i])));
    }
    inp.addEventListener('input', () => { val[f.k] = inp.value.trim() ? {s: inp.value} : undefined; d.classList.remove('bad'); yangila(); });
    if (f.rasm){
      const det = el('details', 'rasm'); det.open = f.k === 'pasport';
      det.appendChild(el('summary', '', '🖼 Қаерда ёзилган? — расмни кўриш'));
      const i1 = el('img'); i1.src = IMG.id; i1.alt = 'ID-карта намунаси';
      const i2 = el('img'); i2.src = IMG.pas; i2.alt = 'Паспорт намунаси';
      det.appendChild(i1); det.appendChild(i2); d.appendChild(det);
    }
    nodes[f.k] = {d, f, inp};
  }
  d.appendChild(el('div', 'e'));
  return d;
}

// иш тажрибаси блоки
const ishlar = [];
let ishBox, ishList, ishYoq, ishAdd;
function ishBlok(){
  const d = el('div', 'f'); d.id = 'f_ish';
  const lab = el('label', 'q', 'Иш тажрибаси (расмий ёки норасмий, ҳаммасини ёзинг)'); lab.appendChild(el('span', 'req', ' *')); d.appendChild(lab);
  d.appendChild(el('div', 'h', 'Охирги иш жойларидан бошланг (энг кўпи ' + ISH.max + ' та).'));
  const yl = el('label', 'chk'); ishYoq = el('input'); ishYoq.type = 'checkbox'; yl.appendChild(ishYoq); yl.appendChild(el('span', '', 'Ишламаганман'));
  d.appendChild(yl);
  ishList = el('div'); d.appendChild(ishList);
  ishAdd = el('button', 'btn sec', '➕ Иш жойи қўшиш'); ishAdd.type = 'button'; d.appendChild(ishAdd);
  ishAdd.onclick = () => { ishQosh(); yangila(); };
  ishYoq.onchange = () => { ishList.style.display = ishAdd.style.display = ishYoq.checked ? 'none' : ''; d.classList.remove('bad'); yangila(); };
  d.appendChild(el('div', 'e'));
  ishBox = d; return d;
}
function ishQosh(){
  if (ishlar.length >= ISH.max) return;
  const o = {sabab: undefined}; const b = el('div', 'ish');
  const t = el('div', 't'); const n = el('span'); t.appendChild(n);
  const del = el('button', 'del', 'Ўчириш'); del.type = 'button'; t.appendChild(del); b.appendChild(t);
  const row = (txt, node) => { const r = el('div', 'row'); r.appendChild(el('label', '', txt)); r.appendChild(node); b.appendChild(r); return node; };
  o.t = row('Ташкилот номи', matnInput({k:'ish_t', t:'matn'}, ISH.tmax));
  o.l = row('Лавозимингиз', matnInput({k:'ish_l', t:'matn'}, ISH.lmax));
  const two = el('div', 'two'); o.d1 = el('input'); o.d1.type = 'text'; o.d1.inputMode = 'numeric'; o.d1.placeholder = 'Бошланиш'; oyMask(o.d1);
  o.d2 = el('input'); o.d2.type = 'text'; o.d2.inputMode = 'numeric'; o.d2.placeholder = 'Тугаш'; oyMask(o.d2);
  two.appendChild(o.d1); two.appendChild(o.d2); row('Иш даври — ой.йил (масалан 03.2022)', two);
  const hl = el('label', 'chk'); o.hoz = el('input'); o.hoz.type = 'checkbox'; hl.appendChild(o.hoz); hl.appendChild(el('span', '', 'Ҳозиргача шу ерда ишлаяпман'));
  b.appendChild(hl);
  o.hoz.onchange = () => { o.d2.disabled = o.hoz.checked; if (o.hoz.checked) o.d2.value = ''; yangila(); };
  const sb = el('div', 'bq'); sb.style.display = 'none'; o.sbInp = matnInput({k:'ish_s', t:'matn'}, ISH.sabab_bq[3], ISH.sabab_bq[1]); sb.appendChild(o.sbInp);
  const c = chips(ISH.sabab_v, false, on => { const i = on.indexOf(true); o.sabab = i >= 0 ? i : undefined; sb.style.display = (i >= 0 && ISH.sabab_v[i] === ISH.sabab_bq[0]) ? '' : 'none'; yangila(); });
  row('Ишдан бўшаш сабаби', c.box); b.appendChild(sb);
  [o.t, o.l, o.d1, o.d2, o.sbInp].forEach(x => x.addEventListener('input', () => { ishBox.classList.remove('bad'); yangila(); }));
  del.onclick = () => { ishlar.splice(ishlar.indexOf(o), 1); b.remove(); raqamla(); yangila(); };
  o.el = b; o.n = n; ishlar.push(o); ishList.appendChild(b); raqamla();
}
function raqamla(){ ishlar.forEach((o, i) => o.n.textContent = (i + 1) + '-иш жойи'); ishAdd.style.display = (ishYoq && ishYoq.checked) || ishlar.length >= ISH.max ? 'none' : ''; }
function ishDavr(o){ const a = o.d1.value.trim(), b = o.hoz.checked ? 'ҳозиргача' : o.d2.value.trim(); return (a && b) ? a + ' – ' + b : ''; }

// чизиш
F.forEach(f => {
  if (f.bolim){ form.appendChild(el('div', 'bolim', f.bolim)); card = el('div', 'card'); form.appendChild(card); return; }
  if (!card){ card = el('div', 'card'); form.appendChild(card); }
  card.appendChild(f.t === 'ish' ? ishBlok() : maydon(f));
});
ishQosh();
document.getElementById('rozi_t').textContent = ROZI;
document.getElementById('rozilik').onchange = () => { document.getElementById('f_rozilik').classList.remove('bad'); yangila(); };

// ---------- йиғиш ва текшириш ----------
function bqMatn(f){ return nodes[f.k].bqInp ? nodes[f.k].bqInp.value.trim() : ''; }
function payload(xato){
  const a = {rozilik: document.getElementById('rozilik').checked};
  const X = xato || [];
  F.forEach(f => {
    if (!f.k || f.k === 'ish') return;
    const nd = nodes[f.k]; const ak = aktiv(f); nd.d.classList.toggle('hid', !ak);
    if (!ak) return;
    const v = val[f.k];
    const xa = (m) => X.push([f.k, m]);
    if (!v){ if (!f.ixt) xa('Тўлдирилмаган.'); return; }
    if (f.t === 'tanlov'){
      if (f.bq && f.v[v.i] === f.bq[0]){ const b = bqMatn(f); const e = tekshir(f.bq[2], b, {}); if (e) return xa(e); a[f.k] = {b}; }
      else a[f.k] = v.i;
      return;
    }
    if (f.t === 'kop'){
      if (!v.k || !v.k.length){ if (!f.ixt) xa('Камида биттасини белгиланг.'); return; }
      const o = {i: v.k};
      if (f.bq && v.k.some(i => f.v[i] === f.bq[0])){ const b = bqMatn(f); const e = tekshir(f.bq[2], b, {}); if (e) return xa(e); o.b = b; }
      a[f.k] = o; return;
    }
    const s = v.s.trim(); const e = tekshir(f.t, s, f); if (e) return xa(e);
    a[f.k] = s;
  });
  if (ishYoq.checked) a.ishlamagan = true;
  else {
    const L = [];
    if (!ishlar.length) X.push(['ish', 'Камида битта иш жойини ёзинг ёки «Ишламаганман»ни белгиланг.']);
    ishlar.forEach((o, i) => {
      const n = (i + 1) + '-иш жойи: ';
      const t = o.t.value.trim(), l = o.l.value.trim(), dv = ishDavr(o);
      if (!t) return X.push(['ish', n + 'ташкилот номи.']);
      if (!l) return X.push(['ish', n + 'лавозим.']);
      const e = tekshir('davr', dv); if (e) return X.push(['ish', n + e]);
      if (o.sabab === undefined) return X.push(['ish', n + 'бўшаш сабабини танланг.']);
      let s = o.sabab;
      if (ISH.sabab_v[o.sabab] === ISH.sabab_bq[0]){ const b = o.sbInp.value.trim(); if (!b) return X.push(['ish', n + 'бўшаш сабабини ёзинг.']); s = {b}; }
      L.push({t, l, d: dv, s});
    });
    a.ish = L;
  }
  if (!a.rozilik) X.push(['rozilik', 'Розиликсиз анкета юборилмайди.']);
  return {v: 1, a};
}
function bayt(s){ return new TextEncoder().encode(s).length; }
function yangila(){
  const X = []; const p = payload(X);
  const jami = F.filter(f => f.k && !f.ixt && (f.k === 'ish' || aktiv(f))).length + 1;
  const xk = new Set(X.map(x => x[0]));
  const tayyor = F.filter(f => f.k && !f.ixt && (f.k === 'ish' || aktiv(f)) && !xk.has(f.k)).length + (xk.has('rozilik') ? 0 : 1);
  const pc = Math.round(100 * tayyor / jami);
  document.getElementById('bar').style.width = pc + '%';
  document.getElementById('pct').textContent = pc + '% тўлдирилди';
  const b = bayt(JSON.stringify(p));
  document.getElementById('size').textContent = b > WA_MAX * 0.85 ? ('Ҳажм: ' + b + ' / ' + WA_MAX + ' байт — матнларни қисқартиринг') : '';
  if (IN_TG) { TG.MainButton.setText(X.length ? 'Юбориш (' + pc + '%)' : 'Юбориш ✅'); TG.MainButton.show(); }
  return {X, p, b};
}
function xabar(t){ const x = document.getElementById('xabar'); x.textContent = t; x.style.display = 'block'; clearTimeout(xabar.t); xabar.t = setTimeout(() => x.style.display = 'none', 4000); }
function yubor(){
  document.querySelectorAll('.f.bad').forEach(d => d.classList.remove('bad'));
  const {X, p, b} = yangila();
  if (X.length){
    X.forEach(([k, m]) => { const d = document.getElementById('f_' + k); if (d){ d.classList.add('bad'); const e = d.querySelector(':scope > .e'); if (e) e.textContent = m; } });
    const d = document.getElementById('f_' + X[0][0]); if (d) d.scrollIntoView({behavior: 'smooth', block: 'center'});
    if (IN_TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred('error');
    xabar('⚠️ ' + X.length + ' та жойни тузатинг (қизил билан белгиланган).'); return;
  }
  const s = JSON.stringify(p);
  if (b > WA_MAX){ xabar('Матнлар жуда узун (' + b + ' байт). Бир оз қисқартиринг.'); return; }
  if (IN_TG){ TG.sendData(s); }
  else { console.log('sendData', s); xabar('✅ Синов режими: маълумот тайёр (' + b + ' байт). Telegram ичида бу ботга юборилади.'); window.__NATIJA = s; }
}
document.getElementById('yubor').onclick = yubor;
if (IN_TG) TG.MainButton.onClick(yubor);
yangila();
</script>
